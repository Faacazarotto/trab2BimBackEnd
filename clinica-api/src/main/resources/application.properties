spring.application.name=clinica-api

# Banco H2 em arquivo (os dados persistem entre execuções).
# Para PostgreSQL: troque url/driver e adicione a dependência do driver no pom.xml.
spring.datasource.url=jdbc:h2:file:./data/clinicadb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (a chave deve ter pelo menos 32 caracteres; em produção use variável de ambiente)
app.jwt.secret=${JWT_SECRET:clinica-api-chave-secreta-muito-longa-para-hs256-2026}
app.jwt.expiration-ms=3600000
